spring.application.name=telecom-bridge-gateway
server.port=8080

# ---- Diameter peer (env override: DIAMETER_HOST, DIAMETER_PORT, ...) ----
diameter.host=localhost
diameter.port=3868
diameter.origin-host=gateway.example.com
diameter.origin-realm=example.com
diameter.destination-realm=example.com
diameter.host-ip=127.0.0.1
diameter.service-context-id=32251@3gpp.org
diameter.request-timeout=2s
diameter.connect-timeout=5s
diameter.capabilities-timeout=5s
diameter.watchdog-interval=30s
diameter.reconnect-initial-delay=1s
diameter.reconnect-max-delay=30s
diameter.max-pending=10000

# ---- Observability (Prometheus / Grafana) ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.gateway.charge=true
management.metrics.distribution.percentiles.gateway.charge=0.5,0.95,0.99
