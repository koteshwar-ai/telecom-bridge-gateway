name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Unit + integration tests
        run: ./mvnw -B verify
      - name: Docker image
        run: docker build -t telecom-bridge-gateway:${{ github.sha }} .
